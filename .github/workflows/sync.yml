name: Refresh Solution index

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solution-index-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install kaggle==2.2.4
      - run: python scripts/sync.py --self-check
      - name: Refresh index
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/sync.py
      - name: Require verified coverage
        run: |
          python -c "import json; count = len(json.load(open('public/index.json', encoding='utf-8'))['solutions']); print(f'{count} verified solutions'); assert count >= 30, 'need at least 30 verified solutions'"
      - name: Commit changed index
        run: |
          if git diff --quiet -- public/index.json; then exit 0; fi
          git config user.name "bettercallsol-bot"
          git config user.email "bettercallsol-bot@users.noreply.github.com"
          git add public/index.json
          git commit -m "data: refresh Solution index"
          git push
